<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X Marks The Spot — Host Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B2027; --panel:#153840; --brass:#C9A227; --brass-light:#E7C766; --brass-dim:#8a7332;
    --paper:#E8DCB8; --paper-ink:#2b1d0e; --sea:#5f8f88; --sea-2:#4a7a75;
    --cream:#F1EAD6; --muted:#9fc0bd; --correct:#4c7a6d; --correct-light:#9fd0bf; --wrong:#b5502f;
    --shadow:rgba(0,0,0,.45);
    --font-display:'IM Fell English', Georgia, serif;
    --font-body:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    background:var(--ink); color:var(--cream); font-family:var(--font-body); min-height:100vh;
    background-image: radial-gradient(circle at 15% 8%, rgba(201,162,39,.10), transparent 40%), radial-gradient(circle at 90% 85%, rgba(201,162,39,.08), transparent 45%);
  }
  header{display:flex; align-items:center; justify-content:space-between; padding:22px 36px; flex-wrap:wrap; gap:10px;}
  h1{font-family:var(--font-display); font-weight:400; font-size:2.1rem; color:var(--brass-light); margin:0; letter-spacing:.3px;}
  .live{display:flex; align-items:center; gap:8px; font-size:.95rem; color:var(--muted);}
  .dot{width:10px; height:10px; border-radius:50%; background:#4c7a6d; box-shadow:0 0 0 rgba(76,122,109,.6); animation:livepulse 1.6s infinite;}
  @keyframes livepulse{0%{box-shadow:0 0 0 0 rgba(76,122,109,.6);} 70%{box-shadow:0 0 0 10px rgba(76,122,109,0);} 100%{box-shadow:0 0 0 0 rgba(76,122,109,0);}}
  .stats{display:flex; gap:26px; padding:0 36px 10px; flex-wrap:wrap;}
  .stat{font-size:.9rem; color:var(--muted);}
  .stat b{color:var(--brass-light); font-family:var(--font-display); font-size:1.3rem; font-weight:400; margin-right:5px;}

  .layout{display:flex; gap:24px; padding:10px 36px 36px; align-items:flex-start; flex-wrap:wrap;}
  .map-col{flex:1 1 560px; min-width:320px;}
  .lb-col{flex:0 0 360px; min-width:300px;}

  .panel-title{font-size:.8rem; letter-spacing:.4px; color:var(--brass-light); font-weight:600; margin-bottom:10px;}
  .map-wrap{position:relative; border-radius:8px; overflow:hidden; box-shadow:0 10px 30px var(--shadow); background:var(--paper);}
  svg#mapSvg{display:block; width:100%; height:auto;}

  table{width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--brass-dim); border-radius:6px; overflow:hidden;}
  th{text-align:left; font-size:.72rem; letter-spacing:.3px; color:var(--muted); font-weight:600; padding:12px 14px 10px; border-bottom:1px solid var(--brass-dim);}
  th:last-child, td:last-child{text-align:right;}
  td{padding:13px 14px; border-bottom:1px solid rgba(201,162,39,.12); font-size:1rem;}
  tr:last-child td{border-bottom:none;}
  .rank{font-family:var(--font-display); font-size:1.4rem; color:var(--brass-light); width:30px;}
  .rank.gold{color:#E7C766;} .rank.silver{color:#cfd6d4;} .rank.bronze{color:#c98a4f;}
  .lb-empty{text-align:center; color:var(--muted); padding:40px 10px; font-size:.95rem; background:var(--panel); border:1px solid var(--brass-dim); border-radius:6px;}
  .miss{color:var(--muted); font-size:.78rem; font-weight:500;}

  .pin-flash{animation:flashIn .9s ease;}
  @keyframes flashIn{0%{opacity:0; transform:scale(0);} 40%{opacity:1; transform:scale(1.6);} 100%{opacity:1; transform:scale(1);}}

  .intake{background:var(--panel); border:1px solid var(--brass-dim); border-radius:6px; padding:16px 18px; margin-bottom:16px;}
  .intake-row{display:flex; gap:10px; align-items:flex-start; flex-wrap:wrap;}
  .intake textarea{flex:1 1 320px; min-width:220px; font-family:'Courier New', monospace; font-size:.85rem; padding:10px 12px; border-radius:4px; border:1.5px solid var(--brass-dim); background:var(--ink); color:var(--brass-light); resize:vertical; min-height:44px;}
  .intake textarea:focus{outline:2px solid var(--brass); outline-offset:1px;}
  .intake-btn{flex:0 0 auto; font-family:'Inter', sans-serif; font-weight:600; font-size:.95rem; background:var(--brass); color:var(--ink); border:none; border-radius:4px; padding:12px 22px; cursor:pointer;}
  .intake-btn:active{transform:translateY(1px);}
  .intake-msg{font-size:.82rem; margin-top:10px; min-height:1.2em;}
  .intake-msg.ok{color:var(--correct-light);}
  .intake-msg.err{color:#e0a98f;}

  .photo-panel summary{cursor:pointer; color:var(--brass-light); font-size:.85rem; margin-bottom:4px;}
  .photo-row{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:12px;}
  .photo-row input[type="text"]{font-family:'Inter', sans-serif; font-size:.9rem; padding:9px 11px; border-radius:4px; border:1.5px solid var(--brass-dim); background:var(--ink); color:var(--cream); width:160px;}
  .photo-row input[type="file"]{color:var(--muted); font-size:.82rem;}
  .photo-list{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px;}
  .photo-chip{display:flex; align-items:center; gap:6px; background:var(--ink); border:1px solid var(--brass-dim); border-radius:999px; padding:4px 10px 4px 4px; font-size:.78rem; color:var(--cream);}
  .photo-chip img{width:22px; height:22px; border-radius:50%; object-fit:cover;}
  .photo-chip button{background:none; border:none; color:var(--muted); cursor:pointer; font-size:.85rem; padding:0 2px;}
</style>
</head>
<body>
<header>
  <h1>Croeso i Borthmadog<span style="font-size:1.1rem; color:var(--muted); margin-left:10px; font-family:var(--font-body); font-weight:500;">Host board</span></h1>
  <div class="live"><span class="dot"></span>Live on this device</div>
</header>
<div class="stats">
  <div class="stat"><b id="pinCount">0</b>found the treasure</div>
  <div class="stat"><b id="doneCount">0</b>finished</div>
</div>

<div style="padding:0 36px;">
  <div class="intake">
    <div class="panel-title" style="margin-bottom:12px;">Reveal a player &mdash; paste their code</div>
    <div class="intake-row">
      <textarea id="codeInput" rows="2" placeholder="Paste the code a player copied from their results screen&hellip;"></textarea>
      <button class="intake-btn" id="revealBtn">Drop their pin</button>
    </div>
    <div class="intake-msg" id="intakeMsg"></div>
  </div>

  <details class="photo-panel intake">
    <summary>Add team photos (optional &mdash; shows on the map instead of initials)</summary>
    <div class="photo-row">
      <input type="text" id="photoName" placeholder="Name (must match what they typed)">
      <input type="file" id="photoFile" accept="image/*">
      <button class="intake-btn" id="photoAddBtn" style="padding:9px 18px;">Add photo</button>
    </div>
    <div class="photo-list" id="photoList"></div>
  </details>
</div>

<div class="layout">
  <div class="map-col">
    <div class="panel-title">Who&rsquo;s found Rockcliffe</div>
    <div class="map-wrap"><svg id="mapSvg" viewBox="0 0 1158 833" xmlns="http://www.w3.org/2000/svg"></svg></div>
  </div>
  <div class="lb-col">
    <div class="panel-title">Leaderboard</div>
    <div id="lbContent"><div class="lb-empty">Waiting for the first code&hellip;</div></div>
  </div>
</div>

  function saveState(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify({players:players, photos:photos}));
    }catch(e){ /* private window or storage blocked — the board still works for this session */ }
  }
  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return;
      var parsed = JSON.parse(raw);
      players = parsed.players || {};
      photos = parsed.photos || {};
    }catch(e){ players = {}; photos = {}; }
  }

  // ---------- score code decode (matches the game's XMTS1- format) ----------
  function b64urlDecode(str){
    str = str.replace(/-/g,'+').replace(/_/g,'/');
    while(str.length % 4){ str += '='; }
    return decodeURIComponent(escape(atob(str)));
  }
  function decodeCode(raw){
    var code = (raw||'').trim();
    if(!code) throw new Error('Paste a code first.');
    if(code.indexOf('XMTS1-') !== 0) throw new Error('That doesn\u2019t look like a code from the game — check it was copied in full.');
    var json = b64urlDecode(code.slice(6));
    var data = JSON.parse(json);
    if(!data.n || typeof data.s !== 'number') throw new Error('Code looks corrupted — ask them to copy it again.');
    return data;
  }

  // ---------- map drawing (shares the game's real map + pin style) ----------
  function teardropPath(scale){
    scale = scale || 1;
    var a=(-4*scale).toFixed(2), b=(-16*scale).toFixed(2), c=(-24*scale).toFixed(2), d=(-28*scale).toFixed(2), e=(-48*scale).toFixed(2), f=(24*scale).toFixed(2), g=(4*scale).toFixed(2);
    return 'M0,0 C'+a+','+b+' '+c+','+d+' '+c+','+e+' A'+f+','+f+' 0 1 1 '+f+','+e+' C'+f+','+d+' '+g+','+b+' 0,0 Z';
  }
  function cornerMark(x,y,dx,dy){
    return '<path d="M'+x+','+(y+16*dy)+' L'+x+','+y+' L'+(x+16*dx)+','+y+'" fill="none" stroke="var(--brass)" stroke-width="2"/>';
  }
  function frameBorder(){
    var m1=10, m2=17;
    return '<rect x="'+m1+'" y="'+m1+'" width="'+(MAP_W-2*m1)+'" height="'+(MAP_H-2*m1)+'" fill="none" stroke="var(--brass)" stroke-width="3"/>'+
           '<rect x="'+m2+'" y="'+m2+'" width="'+(MAP_W-2*m2)+'" height="'+(MAP_H-2*m2)+'" fill="none" stroke="var(--brass-dim)" stroke-width="1.2"/>'+
           cornerMark(m1,m1,1,1)+cornerMark(MAP_W-m1,m1,-1,1)+cornerMark(m1,MAP_H-m1,1,-1)+cornerMark(MAP_W-m1,MAP_H-m1,-1,-1);
  }
  function compassRose(cx,cy){
    return '<g opacity="0.75" stroke="var(--paper-ink)">'+
      '<circle cx="'+cx+'" cy="'+cy+'" r="22" fill="none" stroke-width="1"/>'+
      '<line x1="'+cx+'" y1="'+(cy-22)+'" x2="'+cx+'" y2="'+(cy+22)+'" stroke-width="1"/>'+
      '<line x1="'+(cx-22)+'" y1="'+cy+'" x2="'+(cx+22)+'" y2="'+cy+'" stroke-width="1"/>'+
      '<path d="M'+cx+','+(cy-22)+' L'+(cx+5)+','+cy+' L'+cx+','+(cy+22)+' L'+(cx-5)+','+cy+' Z" fill="var(--paper-ink)" opacity="0.5" stroke="none"/>'+
      '<text x="'+cx+'" y="'+(cy-28)+'" font-family="Inter, sans-serif" font-size="9" fill="var(--paper-ink)" opacity="0.8" font-weight="700" text-anchor="middle" letter-spacing="0.4">N</text>'+
      '</g>';
  }
  function treasureMarkup(){
    var d = teardropPath(1);
    return '<g transform="translate('+TREASURE_SPOT.x+','+TREASURE_SPOT.y+')">'+
      '<circle class="halo" cx="0" cy="0" r="9" fill="var(--brass-light)" opacity="0.25"/>'+
      '<path d="'+d+'" transform="translate(2,3)" fill="rgba(0,0,0,.35)"/>'+
      '<path d="'+d+'" fill="var(--wrong)" stroke="var(--paper-ink)" stroke-width="1.5"/>'+
      '<circle cx="0" cy="-48" r="17" fill="var(--wrong)" stroke="var(--paper-ink)" stroke-width="1.5"/>'+
      '<path d="M0,-61 L2.6,-53.4 L10.5,-53.4 L4.1,-48.7 L6.5,-41 L0,-45.7 L-6.5,-41 L-4.1,-48.7 L-10.5,-53.4 L-2.6,-53.4 Z" fill="var(--paper-ink)" stroke="none"/>'+
      '<text x="0" y="20" font-family="\'IM Fell English\', serif" font-size="15" fill="var(--paper-ink)" text-anchor="middle">Rockcliffe</text>'+
      '</g>';
  }

  function buildBaseMap(){
    var svg=$('#mapSvg');
    svg.setAttribute('viewBox', '0 0 '+MAP_W+' '+MAP_H);
    var html = '';
    html += '<image href="'+MAP_IMG+'" x="0" y="0" width="'+MAP_W+'" height="'+MAP_H+'" preserveAspectRatio="xMidYMid slice"/>';
    html += '<rect x="0" y="0" width="'+MAP_W+'" height="'+MAP_H+'" fill="rgba(20,45,40,0.12)"/>';
    html += compassRose(1090,70);
    html += frameBorder();
    html += treasureMarkup();
    html += '<g id="pinsLayer"></g>';
    svg.innerHTML = html;
  }

  // Players who found the treasure cluster around Rockcliffe in a small
  // sunflower spiral, in the order they were revealed, since the game
  // doesn't record where each player guessed — only whether they got there.
  function spiralOffset(i){
    var angle = i * 2.399963; // golden angle, radians
    var radius = 20 + 8*Math.sqrt(i);
    return {x: TREASURE_SPOT.x + radius*Math.cos(angle), y: TREASURE_SPOT.y + 34 + radius*Math.sin(angle)*0.6};
  }

  function drawPin(slug, p, idx){
    var layer = $('#pinsLayer');
    if(!layer) return;
    var old = document.getElementById('pin-'+slug);
    if(old) old.remove();
    if(!p.found) return; // didn't find the treasure — shown in the leaderboard only
    var pos = spiralOffset(idx);
    var g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('id','pin-'+slug);
    g.setAttribute('class','pin-flash');
    var photo = photos[slug];
    var label = '<text x="'+pos.x+'" y="'+(pos.y-15)+'" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="var(--paper-ink)" text-anchor="middle" paint-order="stroke" stroke="var(--paper)" stroke-width="3">'+escapeHtml(p.name)+'</text>';
    if(photo){
      var clipId = 'clip-'+slug;
      g.innerHTML =
        '<circle cx="'+pos.x+'" cy="'+pos.y+'" r="12" fill="var(--ink)" stroke="var(--brass-light)" stroke-width="2.5"/>'+
        '<clipPath id="'+clipId+'"><circle cx="'+pos.x+'" cy="'+pos.y+'" r="10.5"/></clipPath>'+
        '<image href="'+photo+'" x="'+(pos.x-10.5)+'" y="'+(pos.y-10.5)+'" width="21" height="21" clip-path="url(#'+clipId+')" preserveAspectRatio="xMidYMid slice"/>'+
        label;
    } else {
      g.innerHTML =
        '<circle cx="'+pos.x+'" cy="'+pos.y+'" r="9" fill="var(--correct)" stroke="var(--cream)" stroke-width="2.5"/>'+
        label;
    }
    layer.appendChild(g);
  }

  function redrawAllPins(){
    buildBaseMap();
    var found = Object.keys(players).filter(function(s){ return players[s].found; })
      .sort(function(a,b){ return (players[a].revealedAt||0) - (players[b].revealedAt||0); });
    found.forEach(function(slug,i){ drawPin(slug, players[slug], i); });
  }

  // ---------- leaderboard ----------
  function renderLeaderboard(){
    var content = $('#lbContent');
    var list = Object.keys(players).map(function(k){ return players[k]; });
    list.sort(function(a,b){ return b.score - a.score; });
    $('#doneCount').textContent = list.length;
    $('#pinCount').textContent = list.filter(function(p){ return p.found; }).length;
    if(!list.length){ content.innerHTML = '<div class="lb-empty">Waiting for the first code&hellip;</div>'; return; }
    var rows = '<table><thead><tr><th></th><th>Name</th><th>Score</th></tr></thead><tbody>';
    list.forEach(function(p,i){
      var rankClass = i===0?'gold':i===1?'silver':i===2?'bronze':'';
      var name = escapeHtml(p.name) + (p.found ? '' : '<div class="miss">Didn\u2019t reach Rockcliffe</div>');
      rows += '<tr><td class="rank '+rankClass+'">'+(i+1)+'</td><td>'+name+'</td><td>'+p.score+'</td></tr>';
    });
    rows += '</tbody></table>';
    content.innerHTML = rows;
  }

  // ---------- reveal flow ----------
  function showIntakeMsg(msg, ok){
    var el = $('#intakeMsg');
    el.textContent = msg;
    el.className = 'intake-msg ' + (ok ? 'ok' : 'err');
  }

  $('#revealBtn').addEventListener('click', function(){
    var input = $('#codeInput');
    try{
      var data = decodeCode(input.value);
      var slug = slugName(data.n);
      players[slug] = { name:data.n, score:data.s, found: data.f===1, timeTaken:data.t, revealedAt:Date.now() };
      saveState();
      renderLeaderboard();
      redrawAllPins();
      showIntakeMsg('\u2713 ' + data.n + ' revealed — ' + data.s + ' points' + (data.f===1 ? ', found the treasure!' : '.'), true);
      input.value = '';
    }catch(err){
      showIntakeMsg(err.message || 'Couldn\u2019t read that code.', false);
    }
  });
  $('#codeInput').addEventListener('keydown', function(e){
    if(e.key === 'Enter' && (e.metaKey || e.ctrlKey)){ $('#revealBtn').click(); }
  });

  // ---------- team photos ----------
  function renderPhotoList(){
    var list = $('#photoList');
    var names = Object.keys(photos);
    if(!names.length){ list.innerHTML = ''; return; }
    list.innerHTML = names.map(function(slug){
      return '<span class="photo-chip"><img src="'+photos[slug]+'" alt=""><span>'+escapeHtml(slug)+'</span>'+
             '<button data-slug="'+slug+'" title="Remove">\u2715</button></span>';
    }).join('');
    list.querySelectorAll('button[data-slug]').forEach(function(btn){
      btn.addEventListener('click', function(){
        delete photos[btn.getAttribute('data-slug')];
        saveState(); renderPhotoList(); redrawAllPins();
      });
    });
  }
  $('#photoAddBtn').addEventListener('click', function(){
    var nameEl = $('#photoName'), fileEl = $('#photoFile');
    var name = nameEl.value.trim();
    var file = fileEl.files && fileEl.files[0];
    if(!name || !file) return;
    var reader = new FileReader();
    reader.onload = function(){
      photos[slugName(name)] = reader.result;
      saveState();
      renderPhotoList();
      redrawAllPins();
      nameEl.value = ''; fileEl.value = '';
    };
    reader.readAsDataURL(file);
  });

  // ---------- init ----------
  loadState();
  redrawAllPins();
  renderLeaderboard();
  renderPhotoList();
})();
</script>
</body>
</html>
